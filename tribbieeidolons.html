<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tribbieeidolons</title>
<link href="tribbie.css" rel="stylesheet" type="text/css">
</head>

<body id="eidolonpage">

	<div id="bg">
		<img src="tribbie/tribbiebg.png" width="105%" height="10%">
	</div>

	<div id="box">
		<div id="banner">
			<div id="menu">
		<a href="index.html"><img src="aglaea/menu.png" alt="Home" width="80px"></a>
	</div>
			<img src="tribbie/tribbiebanner.png" width="100%">
		</div>

	<div id="navigation">
		<a href="tribbieinfo.html#info">CHARACTER INFO</a>
		<a href="tribbieabilities.html#abilities">ABILITIES</a>
		<a href="tribbiebuild.html#build">BUILD</a>
		<a href="tribbieeidolons.html#eidolons">EIDOLONS</a>
		<a href="tribbieteam.html#team">TEAM COMPS</a>
	</div>


	<div id="eidolons">
		<h2>EIDOLONS</h2>
	</div>

		<div class="eidolons-constellation">
			<button class="eidolon-btn eido-1 lightbox-trigger" data-title="EIDOLON 1" data-subtitle="Rite of Sugar Scoop" data-desc="While the Zone lasts and after ally targets attack enemies, additionally deals True DMG equal to 24% of the total DMG of this attack to targets that have been dealt Additional DMG by the Zone.">
			<img src="tribbie/tribbiee1.png" alt="Eidolon I" width="450px">
			<span class="eido-text">
				<span class="eido-title-text">EIDOLON 1</span>
				<span class="eido-sub">Rite of Sugar Scoop</span>
			</span>
		</button>

		<button class="eidolon-btn eido-2 lightbox-trigger" data-title="EIDOLON 2" data-subtitle="Guide of Dream Tour" data-desc="The Additional DMG dealt by the Zone increases to 120% of the original DMG. When the Zone deals Additional DMG, further deals 1 instance(s) of Additional DMG.">
			<img src="tribbie/tribbiee2.png" alt="Eidolon II" width="450px">
			<span class="eido-text">
				<span class="eido-title-text">EIDOLON 2</span>
				<span class="eido-sub">Guide of Dream Tour</span>
			</span>
		</button>

		<button class="eidolon-btn eido-3 lightbox-trigger" data-title="EIDOLON 3" data-subtitle="Trove of Morning Glow" data-desc="Ultimate Lv. +2, up to a maximum of Lv. 15. Basic ATK Lv. +1, up to a maximum of Lv. 10.">
			<img src="tribbie/tribbiee3.png" alt="Eidolon III" width="550px">
			<span class="eido-text">
				<span class="eido-title-text">EIDOLON 3</span>
				<span class="eido-sub">Trove of Morning Glow</span>
			</span>
		</button>

		<button class="eidolon-btn eido-4 lightbox-trigger" data-title="EIDOLON 4" data-subtitle="Peace of Empathy Bond" data-desc="While ‘Numinosity’ lasts, the DMG dealt by all allies ignores 18% of the target's DEF.">
			<img src="tribbie/tribbiee4.png" alt="Eidolon IV" width="450px">
			<span class="eido-text">
				<span class="eido-title-text">EIDOLON 4</span>
				<span class="eido-sub">Peace of Empathy Bond</span>
			</span>
		</button>

		<button class="eidolon-btn eido-5 lightbox-trigger" data-title="EIDOLON 5" data-subtitle="Clock of Wonder Origin" data-desc="Skill Lv. +2, up to a maximum of Lv. 15. Talent Lv. +2, up to a maximum of Lv. 15.">
			<img src="tribbie/tribbiee5.png" alt="Eidolon V" width="450px">
			<span class="eido-text">
				<span class="eido-title-text">EIDOLON 5</span>
				<span class="eido-sub">Clock of Wonder Origin</span>
			</span>
		</button>

		<button class="eidolon-btn eido-6 lightbox-trigger" data-title="EIDOLON 6" data-subtitle="Morrow of Star Shine" data-desc="After Tribbie uses Ultimate, launches her Talent's Follow-up ATK against all enemies. The DMG dealt by Talent's Follow-up ATK increases by 729%.">
			<img src="tribbie/tribbiee6.png" alt="Eidolon VI" width="550px">
			<span class="eido-text">
				<span class="eido-title-text">EIDOLON 6</span>
				<span class="eido-sub">Morrow of Star Shine</span>
			</span>
		</button>
		</div>
	</div>

	<div id="custom-lightbox" class="lightbox-overlay" onclick="closeLightbox()">
		<div class="lightbox-container" onclick="event.stopPropagation()">
			<div class="lightbox-card">
				<img id="lightbox-img" class="floating-img" src="" alt="Eidolon Art">
				
				<div class="lightbox-info1">
					<h3 id="lightbox-title"></h3>
					<h4 id="lightbox-subtitle"></h4>
					<p id="lightbox-desc"></p>
				</div>
			</div>
		
			<div id="lightbox-outside-text">CLICK ANYWHERE TO CLOSE</div>
		</div>
	</div>

	
	<script>
		const lightbox = document.getElementById('custom-lightbox');
		const lightboxImg = document.getElementById('lightbox-img');
		const lightboxTitle = document.getElementById('lightbox-title');
		const lightboxSubtitle = document.getElementById('lightbox-subtitle');
		const lightboxDesc = document.getElementById('lightbox-desc');

		document.querySelectorAll('.lightbox-trigger').forEach(button => {
			button.addEventListener('click', function() {
				const img = this.querySelector('img');
				lightboxImg.src = img.src;
				lightboxTitle.innerText = this.getAttribute('data-title');
				lightboxSubtitle.innerText = this.getAttribute('data-subtitle').toUpperCase();
				lightboxDesc.innerHTML = this.getAttribute('data-desc');
				
				lightbox.style.display = 'flex';
				setTimeout(() => {
					lightbox.classList.add('active');
				}, 10);
			});
		});

		function closeLightbox() {
			lightbox.classList.remove('active');
			setTimeout(() => {
				lightbox.style.display = 'none';
			}, 400);
		}
	</script>
		
</body>
</html>
